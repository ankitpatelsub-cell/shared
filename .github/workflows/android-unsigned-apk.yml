name: Android Unsigned APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-unsigned-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-unsigned-apk.yml"

jobs:
  build-unsigned-apk:
    name: Build unsigned .apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper is committed (same reasoning as the iOS side not
      # committing a binary blob the sandbox can't verify) — setup-gradle
      # installs the pinned Gradle version itself when no wrapper is found.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Lint
        run: gradle :app:lintRelease --stacktrace

      - name: Run unit tests
        run: gradle :app:testReleaseUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TermVault-unsigned-apk
          path: android/${{ steps.apk.outputs.path }}
          if-no-files-found: error
