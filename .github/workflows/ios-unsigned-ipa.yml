name: iOS Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build-unsigned-ipa:
    name: Build unsigned .ipa
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project TermVault.xcodeproj \
            -scheme TermVault \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Find an available iOS Simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone (1[5-9]|[2-9][0-9])' | sed -E 's/^ *([^(]+) \(.*/\1/' | sed -E 's/ *$//')
          if [ -z "$DEVICE" ]; then
            echo "No iPhone 15+ simulator found; falling back to any available iPhone simulator"
            DEVICE=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ *([^(]+) \(.*/\1/' | sed -E 's/ *$//')
          fi
          echo "Using simulator: $DEVICE"
          echo "name=$DEVICE" >> "$GITHUB_OUTPUT"

      # TermVaultTests exists (unit tests for ErrorLogger, HostKeyApprovalService,
      # navigation, attachment naming) with a wired-up scheme, but nothing
      # ran it — this workflow only ever built the app, so the suite could
      # silently rot without CI noticing. Runs on the simulator SDK (unit
      # tests can't run against -sdk iphoneos) before the release build, so
      # a broken test fails fast instead of wasting time packaging an IPA.
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project TermVault.xcodeproj \
            -scheme TermVault \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Build (unsigned, device SDK)
        run: |
          xcodebuild build \
            -project TermVault.xcodeproj \
            -scheme TermVault \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/TermVault.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected app bundle not found at $APP_PATH"
            find build/DerivedData/Build/Products -maxdepth 2
            exit 1
          fi
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" ipa_root/Payload/
          (cd ipa_root && zip -r -q -X "../TermVault-unsigned.ipa" Payload)

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TermVault-unsigned-ipa
          path: ios/TermVault-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
