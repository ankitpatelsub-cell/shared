name: TermVault
options:
  bundleIdPrefix: dev.termvault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.15.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.0
  # Must match the exact fork+range Citadel itself depends on (see Citadel's
  # Package.swift) so SwiftPM resolves one shared NIOSSH module instead of
  # two conflicting packages that both vend a target named "NIOSSH".
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: 0.3.4
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0

targets:
  TermVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/App
    resources:
      - path: Sources/App/Resources/Assets.xcassets
    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.termvault.app
        PRODUCT_NAME: TermVault
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: TermVault
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "TermVault uses Face ID to lock the app and protect your saved hosts, passwords, and SSH keys."
        NSPhotoLibraryUsageDescription: "TermVault lets you select photos to upload as context for an AI terminal session."
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false

  TermVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: TermVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.termvault.tests
        SWIFT_VERSION: "5.9"

schemes:
  TermVault:
    build:
      targets:
        TermVault: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets:
        - TermVaultTests
